name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect Secrets
    uses: ./.github/workflows/_detect-secrets.yml

  code-qa:
    name: Code QA
    needs: [detect-secrets]
    uses: ./.github/workflows/_code-qa.yml

  release:
    name: Release
    needs: [code-qa]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Auth for git commands later in the job (commit, tag, push)
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Build
        run: npm run build

      - name: Release
        env:
          # Auth for GitHub REST API (create release, comment on issues/PRs)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          # Credit people, not @semantic-release/git's "semantic-release-bot".
          # The author wrote the last pushed commit, the committer pushed it
          GIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          GIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL:
            ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: npx semantic-release
